name: Android Debug APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Frontend Assets
        run: |
          npm ci || npm install
          npm run build:renderer
          # Rebuild the bundled web assets from scratch, otherwise stale hashed
          # bundles from previous builds stay in the APK forever. The script also
          # verifies that index.html references files that actually exist.
          npm run android:assets

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/RYOX-VPN-1.1.0-arm64-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RYOX-VPN-v1.1.0-APK
          path: android/app/build/outputs/apk/debug/RYOX-VPN-1.1.0-arm64-debug.apk
          if-no-files-found: error
