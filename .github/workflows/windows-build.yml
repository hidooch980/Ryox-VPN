name: Windows Production Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application
        run: npm run build

      - name: Package Windows Installer & Portable Executable
        run: npx electron-builder --win nsis zip --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ryox-VPN-Windows-x64
          path: dist-packaged/*.exe
