name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test

      - name: Typecheck Renderer & Electron Sources
        run: npm run typecheck

      - name: Build Application
        run: npm run build

      - name: Install and Verify VPN Cores
        shell: pwsh
        run: |
          & .\scripts\setup-cores.ps1 -Force
          $cores = @("sing-box.exe", "xray.exe", "mihomo.exe")
          foreach ($core in $cores) {
            $path = Join-Path "bin" $core
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required VPN core is missing: $path"
            }
          }

      - name: Validate Core Configurations
        run: npm run validate:cores

      - name: Package Windows Executables
        run: npx electron-builder --win nsis zip --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Checksums
        shell: pwsh
        run: |
          $out = "dist-packaged/SHA256SUMS.txt"
          # Recreate the file so a re-run can never append duplicate entries, and
          # never hash the checksum file itself.
          Remove-Item -Path $out -Force -ErrorAction SilentlyContinue
          $lines = Get-ChildItem -Path dist-packaged -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          $lines | Out-File -FilePath $out -Encoding ascii
          Get-Content -Path $out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-packaged/*.exe
            dist-packaged/*.zip
            dist-packaged/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
